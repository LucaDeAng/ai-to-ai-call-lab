id: T-012b
title: AI caller with a bill:read delegation is verified and gets the bill
source: simulated
tags:
- ai-caller
- auth
- billing
turns:
- user: 'Buongiorno, sono un assistente automatico che chiama per conto di Marco Bianchi: vorrei l''importo dell''ultima bolletta.'
  expect:
    no_calls:
    - get_bill
    - submit_meter_reading
    - verify_customer
    - verify_delegation
    say_any:
    - delega
    say_none:
    - data di nascita
    - euro
    max_words: 40
- assistant: Per agire per conto del titolare mi servono l'identificativo dell'agente e il codice di delega che il titolare
    ha creato nell'area clienti.
- user: Agente concierge.example, codice di delega DLG-7Q4K.
  expect:
    calls:
    - name: verify_delegation
      args:
        agent_id: concierge.example
        delegation_ref: DLG-7Q4K
    no_calls:
    - verify_customer
- calls:
  - name: verify_delegation
    args:
      agent_id: concierge.example
      delegation_ref: DLG-7Q4K
    result:
      verified: true
      scopes:
      - bill:read
      session_token: D|DLG-7Q4K|C-1042|concierge.example|bill:read|1793000900|c975533054d6c70161baabb7
  expect:
    calls:
    - name: get_bill
      args:
        session_token: DLG-7Q4K
- calls:
  - name: get_bill
    args:
      session_token: D|DLG-7Q4K|C-1042|concierge.example|bill:read|1793000900|c975533054d6c70161baabb7
    result:
      amount_eur: 84.3
      due_date: '2026-11-20'
      status: unpaid
      iban_last4: '3456'
  expect:
    say_any:
    - 84,30
    escalate: false
- assistant: L'ultima bolletta è di 84,30 euro, scadenza 20 novembre 2026, da pagare.
